# OmniStudio AI - Isolated Nginx Reverse Proxy Config
# Add this file to /etc/nginx/conf.d/omnistudio.conf OR /etc/nginx/sites-available/omnistudio
# This will NOT touch or interfere with your existing website!

server {
    listen 80;
    server_name studio.yourdomain.com; # Replace with your subdomain or domain

    # Allow large uploads for reference images and source motion videos
    client_max_body_size 250M;

    # 1. Real-Time SSE Progress HUD Streaming (Zero Buffering)
    location /api/pipeline/run-stream {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding off;
    }

    # 2. FastAPI Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 3. Static Media Outputs (Images, Videos, Audio)
    location /outputs/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Next.js Frontend Application
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

