version: "3.8"

services:
  # OmniStudio AI Backend (FastAPI + FFmpeg + Neural Engines)
  omni-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/mysamargroup-boop/omnistudio-backend:latest
    container_name: omnistudio-backend
    restart: unless-stopped
    ports:
      # Isolated Host Port 8050 -> Container Port 8000
      # (Leaves port 80, 443, 8000 free for existing host projects)
      - "8050:8000"
    env_file:
      - path: ./.env
        required: false
      - ./backend/.env
    environment:
      - STUDIO_PASSCODE=${STUDIO_PASSCODE:-7391}
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-7391}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      # Mount outputs directory so videos, images, and database persist on the host
      - ./backend/outputs:/app/outputs
    networks:
      - omnistudio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # OmniStudio AI Frontend (Next.js 16 Production App)
  omni-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://31.97.231.218:8050}
        - NEXT_PUBLIC_STUDIO_PASSCODE=${NEXT_PUBLIC_STUDIO_PASSCODE:-7391}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://lsttnpynhwtpkzfbfntf.supabase.co}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzdHRucHluaHd0cGt6ZmJmbnRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY2Mzg4NzgsImV4cCI6MjA2MjIxNDg3OH0.S6t81i8x_9tIcf9Vj90y6lqA5416F6Z6Hn9w46hJ2U4}
    image: ghcr.io/mysamargroup-boop/omnistudio-frontend:latest
    container_name: omnistudio-frontend
    restart: unless-stopped
    ports:
      # Isolated Host Port 3050 -> Container Port 3000
      # (Leaves port 80, 443, 3000 free for existing host projects)
      - "3050:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ./.env
        required: false
      - path: ./frontend/.env.local
        required: false
    environment:
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://omni-backend:8000}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://31.97.231.218:8050}
      - NEXT_PUBLIC_STUDIO_PASSCODE=${NEXT_PUBLIC_STUDIO_PASSCODE:-7391}
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://lsttnpynhwtpkzfbfntf.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzdHRucHluaHd0cGt6ZmJmbnRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY2Mzg4NzgsImV4cCI6MjA2MjIxNDg3OH0.S6t81i8x_9tIcf9Vj90y6lqA5416F6Z6Hn9w46hJ2U4}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      omni-backend:
        condition: service_healthy
    networks:
      - omnistudio-network

networks:
  omnistudio-network:
    name: omnistudio-network
    driver: bridge

