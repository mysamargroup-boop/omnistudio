version: "3.8"

services:
  # OmniStudio AI Backend (FastAPI + FFmpeg + Neural Engines)
  omni-backend:
    image: ghcr.io/mysamargroup-boop/omnistudio-backend:latest
    container_name: omnistudio-backend
    restart: unless-stopped
    ports:
      # Isolated Host Port 8050 -> Container Port 8000
      # (Leaves port 80, 443, 8000 free for existing host projects)
      - "8050:8000"
    env_file:
      - ./backend/.env
    environment:
      - STUDIO_PASSCODE=${STUDIO_PASSCODE}
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      # Mount outputs directory so videos, images, and database persist on the host
      - ./backend/outputs:/app/outputs
    networks:
      - omnistudio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # OmniStudio AI Frontend (Next.js 16 Production App)
  omni-frontend:
    image: ghcr.io/mysamargroup-boop/omnistudio-frontend:latest
    container_name: omnistudio-frontend
    restart: unless-stopped
    ports:
      # Isolated Host Port 3050 -> Container Port 3000
      # (Leaves port 80, 443, 3000 free for existing host projects)
      - "3050:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://omni-backend:8000}
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      omni-backend:
        condition: service_healthy
    networks:
      - omnistudio-network

  # Watchtower for automatic updates from GHCR
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60

networks:
  omnistudio-network:
    name: omnistudio-network
    driver: bridge

