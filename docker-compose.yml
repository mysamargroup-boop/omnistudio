services:
  # OmniStudio AI Backend (FastAPI + FFmpeg + Neural Engines)
  omni-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/mysamargroup-boop/omnistudio-backend:latest
    restart: unless-stopped
    ports:
      # Isolated Host Port 8050 -> Container Port 8000
      # (Leaves port 80, 443, 8000 free for existing host projects)
      - "8050:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - STUDIO_PASSCODE=${STUDIO_PASSCODE}
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      # Mount outputs directory so videos, images, and database persist on the host
      - ./backend/outputs:/app/outputs
    networks:
      - omnistudio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # OmniStudio AI Frontend (Next.js 16 Production App)
  omni-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
        - NEXT_PUBLIC_STUDIO_PASSCODE=${NEXT_PUBLIC_STUDIO_PASSCODE}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ghcr.io/mysamargroup-boop/omnistudio-frontend:latest
    restart: unless-stopped
    ports:
      # Isolated Host Port 3060 -> Container Port 3000
      # (Leaves port 80, 443, 3000, 3050 free for existing host projects)
      - "3060:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ./.env
        required: false
      - path: ./frontend/.env.local
        required: false
    environment:
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://omni-backend:8000}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_STUDIO_PASSCODE=${NEXT_PUBLIC_STUDIO_PASSCODE}
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      omni-backend:
        condition: service_healthy
    networks:
      - omnistudio-network

networks:
  omnistudio-network:
    name: omnistudio-network
    driver: bridge

