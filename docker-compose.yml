version: "3.8"

services:
  # OmniStudio AI Backend (FastAPI + FFmpeg + Neural Engines)
  omni-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnistudio-backend
    restart: unless-stopped
    ports:
      # Isolated Host Port 8050 -> Container Port 8000
      # (Leaves port 80, 443, 8000 free for existing host projects)
      - "8050:8000"
    env_file:
      - ./backend/.env
    environment:
      # Required deployment secrets — MANDATORY. Compose refuses to start if unset.
      # Set these in shell, a .env file, or your platform secret manager.
      - STUDIO_PASSCODE=${STUDIO_PASSCODE:?ERROR: STUDIO_PASSCODE is required for deployment security}
      - JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET must be set to a random 32+ character string}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:?ERROR: BACKEND_API_TOKEN is required for service-to-service calls}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?ERROR: ADMIN_API_TOKEN is required to protect settings/key management}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3050,http://31.97.231.218:3050}
    volumes:
      # Mount outputs directory so videos, images, and database persist on the host
      - ./backend/outputs:/app/outputs
    networks:
      - omnistudio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # OmniStudio AI Frontend (Next.js 16 Production App)
  omni-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnistudio-frontend
    restart: unless-stopped
    ports:
      # Isolated Host Port 3050 -> Container Port 3000
      # (Leaves port 80, 443, 3000 free for existing host projects)
      - "3050:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://omni-backend:8000
      - NODE_ENV=production
      - PORT=3000
      # Supabase public configuration must come from rotated deployment values.
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase project URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the rotated Supabase publishable/anon key}
    depends_on:
      omni-backend:
        condition: service_healthy
    networks:
      - omnistudio-network

networks:
  omnistudio-network:
    name: omnistudio-network
    driver: bridge

