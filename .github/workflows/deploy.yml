name: Auto Deploy OmniStudio to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          password: ${{ secrets.HOSTINGER_VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting Automated Deployment..."
            cd /home/omnistudio
            
            echo "📦 Pulling latest code from GitHub..."
            git pull origin main
            
            echo "🔨 Rebuilding and restarting OmniStudio containers..."
            docker compose up -d --build omni-frontend omni-backend
            
            echo "🧹 Cleaning up dangling build cache..."
            docker image prune -f
            
            echo "✅ Verifying running OmniStudio containers:"
            docker ps --filter "name=omnistudio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "🎉 Deployment to Hostinger VPS Completed Successfully!"
