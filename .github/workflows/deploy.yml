name: Build and Secure Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Images and Deploy Securely
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://vid.flairloop.com
            NEXT_PUBLIC_STUDIO_PASSCODE=7391
            NEXT_PUBLIC_SUPABASE_URL=https://lsttnpynhwtpkzfbfntf.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzdHRucHluaHd0cGt6ZmJmbnRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTg3NTgsImV4cCI6MjEwNDQzNDc1OH0.BltQVtk0-IKKKZAVdD6grkiFcT6_ikXUsHr9BHpZUqM

      - name: Deploy via SSH using Secure GHCR
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          password: ${{ secrets.HOSTINGER_VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "Logging into GHCR on VPS securely..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            mkdir -p /home/omnistudio
            cd /home/omnistudio
            
            echo "Syncing latest docker-compose.yml..."
            curl -fsSL https://raw.githubusercontent.com/mysamargroup-boop/omnistudio/main/docker-compose.yml -o docker-compose.yml
            
            echo "Pulling latest securely-built images from GHCR..."
            docker compose pull
            
            echo "Gracefully stopping and removing any conflicting stale containers..."
            docker compose down --remove-orphans || true
            docker rm -f $(docker ps -a -q --filter "name=omnistudio") 2>/dev/null || true
            
            echo "Ensuring host output directories exist with full permissions..."
            mkdir -p /home/omnistudio/backend/outputs/images /home/omnistudio/backend/outputs/videos /home/omnistudio/backend/outputs/audio /home/omnistudio/backend/outputs/final /home/omnistudio/backend/outputs/trash
            chmod -R 777 /home/omnistudio/backend/outputs || true

            echo "Starting OmniStudio containers with force-recreate..."
            docker compose up -d --remove-orphans --force-recreate
            
            echo "Waiting for container startup..."
            sleep 12
            
            echo "Cleaning up dangling images..."
            docker image prune -f
            
            echo "Verifying containers are running:"
            docker ps --filter "name=omnistudio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "--- Backend Container Logs (Last 40 lines) ---"
            docker logs --tail 40 omnistudio-omni-backend-1 || true
            
            echo "Probing container connectivity locally on VPS..."
            curl -IsS http://localhost:3060 | head -n 5 || true
            curl -IsS http://localhost:8050/api/health | head -n 5 || true
            curl -IsS http://localhost:8050/api/ping | head -n 5 || true
            
            echo "Deployment Completed Successfully!"
