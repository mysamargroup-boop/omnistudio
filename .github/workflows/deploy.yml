name: Build and Secure Deploy to Hostinger

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Images and Deploy Securely
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          password: ${{ secrets.HOSTINGER_VPS_PASSWORD }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/omnistudio"

      - name: Deploy via SSH using Secure GHCR
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          password: ${{ secrets.HOSTINGER_VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Logging into GHCR on VPS securely..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd /home/omnistudio
            
            echo "🔄 Pulling latest securely-built images from GHCR..."
            docker compose pull
            
            echo "🚀 Starting OmniStudio containers..."
            docker compose up -d
            
            echo "🧹 Cleaning up old unused images..."
            docker image prune -af
            
            echo "✅ Verifying containers are running:"
            docker ps --filter "name=omnistudio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "🎉 Secure Deployment Completed Successfully!"
